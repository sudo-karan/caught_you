name: Build Caught_You APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Validates the wrapper jar and caches Gradle downloads between runs.
      # The Android SDK comes preinstalled on GitHub's Ubuntu runners.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # With archive: false the artifact is the bare file (no zip), named after it.
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Caught_You-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/Caught_You-debug.apk
          archive: false
          if-no-files-found: error
